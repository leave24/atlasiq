apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlasiq
  namespace: atlasiq
spec:
  ingressClassName: nginx
  rules:
    - host: atlasiq.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: atlasiq-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlasiq-frontend
                port:
                  number: 3000
