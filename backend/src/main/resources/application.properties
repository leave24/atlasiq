atlasiq.workspace.root=${ATLASIQ_WORKSPACE_ROOT:/workspace}
quarkus.datasource.db-kind=${ATLASIQ_DB_KIND:postgresql}
quarkus.datasource.jdbc.url=${ATLASIQ_DATABASE_URL:jdbc:postgresql://localhost:5432/atlasiq}
quarkus.datasource.username=${ATLASIQ_DATABASE_USER:atlasiq}
quarkus.datasource.password=${ATLASIQ_DATABASE_PASSWORD:atlasiq-local}
quarkus.datasource.jdbc.min-size=${ATLASIQ_DB_POOL_MIN:1}
quarkus.datasource.jdbc.max-size=${ATLASIQ_DB_POOL_MAX:10}
quarkus.datasource.jdbc.acquisition-timeout=${ATLASIQ_DB_ACQUIRE_TIMEOUT:10S}
