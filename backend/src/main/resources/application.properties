atlasiq.workspace.root=${ATLASIQ_WORKSPACE_ROOT:/workspace}
quarkus.datasource.db-kind=${ATLASIQ_DB_KIND:postgresql}
quarkus.datasource.jdbc.url=${ATLASIQ_DATABASE_URL:jdbc:postgresql://localhost:5432/atlasiq}
quarkus.datasource.username=${ATLASIQ_DATABASE_USER:atlasiq}
quarkus.datasource.password=${ATLASIQ_DATABASE_PASSWORD:atlasiq-local}
quarkus.datasource.jdbc.min-size=${ATLASIQ_DB_POOL_MIN:1}
quarkus.datasource.jdbc.max-size=${ATLASIQ_DB_POOL_MAX:10}
quarkus.datasource.jdbc.acquisition-timeout=${ATLASIQ_DB_ACQUIRE_TIMEOUT:10S}

quarkus.oidc.enabled=${ATLASIQ_OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${ATLASIQ_OIDC_ISSUER:http://localhost:8180/realms/atlasiq}
quarkus.oidc.client-id=${ATLASIQ_OIDC_CLIENT_ID:atlasiq}
quarkus.oidc.credentials.secret=${ATLASIQ_OIDC_CLIENT_SECRET:local-development-only}
atlasiq.sso.oidc.authorization-endpoint=${ATLASIQ_OIDC_AUTHORIZATION_ENDPOINT:}
atlasiq.sso.saml.sso-url=${ATLASIQ_SAML_SSO_URL:}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.enabled=${ATLASIQ_OTEL_ENABLED:false}
atlasiq.scan.max-files=${ATLASIQ_SCAN_MAX_FILES:25000}
atlasiq.scan.max-file-bytes=${ATLASIQ_SCAN_MAX_FILE_BYTES:2000000}
atlasiq.scan.timeout-seconds=${ATLASIQ_SCAN_TIMEOUT_SECONDS:120}
